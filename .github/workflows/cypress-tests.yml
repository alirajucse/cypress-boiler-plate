name: Cypress Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Clear NPM Cache (Optional)
        run: npm cache clean --force

      - name: Install Dependencies
        run: npm ci

      - name: Run Cypress Tests on Chrome
        run: npx cypress run --browser chrome

      - name: Upload Cypress Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

      - name: Generate Mochawesome Report
        if: always()
        run: |
          mkdir -p cypress/reports/html
          npx mochawesome-merge cypress/reports/html/.jsons/*.json > cypress/reports/html/report.json || echo "JSON merge failed"
          npx marge cypress/reports/html/report.json --reportDir cypress/reports/html || echo "Report generation failed"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: cypress/reports/html
